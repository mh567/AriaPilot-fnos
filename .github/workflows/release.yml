name: Build and Release FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Unit tests
        run: node --test src/server/*.test.js

      - name: Smoke test
        run: node test/smoke.mjs

      - name: Build FPK
        run: bash scripts/build_fpk.sh --arch all

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.fpk > "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ github.ref_name }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
          body: |
            AriaPilot for fnOS. See docs/FNOS.md for installation, configuration and troubleshooting.
